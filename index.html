<html lang="en">
<head>

<script>
  const CONFIG = {
    // Google Sheet > File > Share > Publish to web > "Calendar Feed" > CSV > copy link
    CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vS1JvtnKNqWN0jHZQW6ejzvzif--qKjbFrQJ7EUt-jhfDNiIaHxU5RaKNoJM8H9-yz-IlXXFiwsV6PE/pub?gid=1295031603&single=true&output=csv",
    HOUSES: [
      { key: "Lake GH",  short: "Lake"  },
      { key: "Ruaha GH", short: "Ruaha" }
    ],
    CONTACT: "" // optional, e.g. "+255 7xx xxx xxx". Shown in the footer.
  };
</script>
<style>
:root{
  --forest:#163A2B; --forest-2:#24533F; --gold:#C29B3B; --gold-soft:#F3E9CF;
  --bg:#F6F4EE; --card:#FFFFFF; --ink:#1D2420; --muted:#6A716C; --line:#E3DED2;
  --free:#2E8B57; --free-bg:#E3F3E8; --free-ink:#1D5E39;
  --busy:#C0392B; --busy-bg:#FBE3E0; --busy-ink:#8E2418;
  --today:#C29B3B; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(22,58,43,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101613; --card:#18211C; --ink:#E9EEEA; --muted:#9AA59F; --line:#2A3630;
    --free-bg:#163524; --free-ink:#8FD9AA; --busy-bg:#3D1C18; --busy-ink:#F2A79D;
    --gold-soft:#3A3220; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101613; --card:#18211C; --ink:#E9EEEA; --muted:#9AA59F; --line:#2A3630;
  --free-bg:#163524; --free-ink:#8FD9AA; --busy-bg:#3D1C18; --busy-ink:#F2A79D;
  --gold-soft:#3A3220; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}

header{background:var(--forest);color:#fff;padding:18px 16px 16px;border-bottom:4px solid var(--gold)}
.wrap{max-width:1100px;margin:0 auto}
header h1{margin:0;font-size:20px;letter-spacing:.2px}
header p{margin:4px 0 0;color:#CFE0D6;font-size:13px}

main{padding:14px 16px 32px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.nav{display:flex;align-items:center;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;font-size:18px}
.iconbtn:hover{border-color:var(--gold)}
.today-btn{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--card);font-weight:600}
.share-btn{background:var(--forest);color:#fff;border-color:var(--forest)}
.share-btn:hover{background:var(--forest-2)}
.share-btn[disabled]{opacity:.6;cursor:wait}
#monthLabel{font-size:20px;font-weight:700;margin:0 6px;min-width:150px}
.legend{margin-left:auto;display:flex;gap:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.sw.free{background:var(--free)} .sw.busy{background:var(--busy)}
.sw.prov{background:repeating-linear-gradient(135deg,var(--busy) 0 3px,#E8806F 3px 6px)}

.banner{background:var(--gold-soft);border:1px solid var(--gold);color:var(--ink);border-radius:10px;
  padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner.err{background:var(--busy-bg);border-color:var(--busy)}

.cal{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:8px 4px;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line)}
.day{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;
  display:flex;flex-direction:column;gap:4px;background:var(--card);text-align:left;border-top:0;border-left:0;border-radius:0}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--bg)}
.day.out .num,.day.out .pill{opacity:.45}
.day.past .pill{opacity:.55}
.num{font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.today .num{background:var(--today);color:#fff}
.pill{display:block;width:100%;border:0;border-radius:6px;padding:4px 6px;font-size:11.5px;line-height:1.2;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill b{font-weight:700}
.pill.free{background:var(--free-bg);color:var(--free-ink);border-left:4px solid var(--free)}
.pill.busy{background:var(--busy-bg);color:var(--busy-ink);border-left:4px solid var(--busy)}
.pill.prov{background:repeating-linear-gradient(135deg,var(--busy-bg) 0 6px,transparent 6px 12px),var(--card);
  color:var(--busy-ink);border-left:4px dashed var(--busy)}
.pill .who{display:block;font-weight:400;opacity:.9;overflow:hidden;text-overflow:ellipsis}
.pill:focus-visible,.day:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

/* Phones: compact cells, colour-only pills with short labels */
@media (max-width:640px){
  main{padding:12px 8px 28px}
  #monthLabel{font-size:18px;min-width:0}
  .legend{margin-left:0;width:100%}
  .day{min-height:74px;padding:3px 2px;gap:3px}
  .num{font-size:11.5px;width:20px;height:20px}
  .pill{padding:3px 2px;font-size:9.5px;text-align:center;border-left-width:0!important;border-radius:4px}
  .pill.free{background:var(--free);color:#fff}
  .pill.busy{background:var(--busy);color:#fff}
  .pill.prov{background:repeating-linear-gradient(135deg,var(--busy) 0 4px,#E8806F 4px 8px);color:#fff}
  .pill .who,.pill .st{display:none}
}

.list{margin-top:18px}
.list h2{font-size:15px;margin:0 0 8px;color:var(--forest)}
:root[data-theme="dark"] .list h2{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .list h2{color:var(--gold)}}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:6px;width:100%;text-align:left}
.row .tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px;background:var(--busy-bg);color:var(--busy-ink);flex:none}
.row .main{flex:1;min-width:0}
.row .main div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px}

footer{max-width:1100px;margin:0 auto;padding:0 16px 28px;color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
footer button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:4px 10px;font-size:12px}

/* Detail sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.open{display:flex}
@media (min-width:641px){.scrim{align-items:center}}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:440px;border-radius:16px 16px 0 0;padding:18px 18px 22px;
  max-height:85vh;overflow:auto}
@media (min-width:641px){.sheet{border-radius:16px}}
.sheet h3{margin:0 0 2px;font-size:17px}
.sheet .date{color:var(--muted);font-size:13px;margin-bottom:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.card .hd strong{font-size:15px}
.status{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:12px}
.status.free{background:var(--free);color:#fff}
.status.busy{background:var(--busy);color:#fff}
.status.prov{background:#E8806F;color:#fff}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13.5px}
dt{color:var(--muted)} dd{margin:0}
.note{margin-top:8px;padding:8px 10px;background:var(--gold-soft);border-radius:8px;font-size:13px}
.close{float:right;border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted)}
.loading{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Kibidula Guest Houses</h1>
  <p>Live availability · Lake GH &amp; Ruaha GH · Tap any day for details</p>
</div></header>

<main class="wrap">
  <div id="banner"></div>
  <div class="bar">
    <div class="nav">
      <button class="iconbtn" id="prev" aria-label="Previous month">‹</button>
      <button class="iconbtn" id="next" aria-label="Next month">›</button>
      <button class="today-btn" id="todayBtn">Today</button>
      <button class="today-btn share-btn" id="shareBtn">Share picture</button>
    </div>
    <div id="monthLabel" aria-live="polite"></div>
    <div class="legend">
      <span><i class="sw free"></i>Available</span>
      <span><i class="sw busy"></i>Booked</span>
      <span><i class="sw prov"></i>Provisional (held)</span>
    </div>
  </div>

  <div class="cal">
    <div class="dow"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
    <div class="grid" id="grid"><div class="loading" style="grid-column:1/-1">Loading calendar…</div></div>
  </div>

  <section class="list">
    <h2 id="listTitle">Bookings this month</h2>
    <div id="list"></div>
  </section>
</main>
<footer>
  <span id="updated"></span>
  <button id="refresh">Refresh</button>
  <span id="contact"></span>
</footer>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>

<script>
// Demo data, used only while CONFIG.CSV_URL is empty
const SAMPLE = [
  ["B001","Cliver Mbwana + family","Lake GH","2026-10-25","2026-11-05","Confirmed",""],
  ["B002","Mr & Mrs Abbott","Ruaha GH","2026-10-30","2026-11-09","Confirmed",""],
  ["B003","Ratcliffs","Ruaha GH","2026-11-11","2026-11-16","Confirmed",""],
  ["B004","Sam Bryson","Lake GH","2026-11-12","2026-11-17","Confirmed",""],
  ["B005","Sylvain Romain & friend","Ruaha GH","2026-11-24","2026-11-30","Confirmed",""],
  ["B006","Mr & Mrs Harnisch & Mr Philip Joseph","Lake GH","2026-11-25","2026-11-30","Confirmed",""],
  ["B007","Mr & Mrs Harnisch & Mr Philip Joseph","Ruaha GH","2026-12-01","2027-01-20","Provisional",""],
  ["B008","Mr & Mrs Mtango + family","Lake GH","2026-12-06","2026-12-22","Confirmed",""],
  ["B009","Zara & family","Lake GH","2026-12-23","2027-01-10","Confirmed",""]
].map(([id,guest,house,arrival,departure,status,note])=>({id,guest,house,arrival,departure,status,note}));

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let bookings=[], view=new Date(); view.setDate(1);

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const nice=s=>{const d=parseISO(s);return `${DAYS[d.getDay()].slice(0,3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`};
const nights=b=>Math.round((parseISO(b.departure)-parseISO(b.arrival))/864e5);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO=iso(new Date());

// ---------- CSV ----------
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f=""}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(f);rows.push(row);row=[];f="" }
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
function normaliseDate(s){
  s=(s||"").trim(); if(!s) return "";
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d=new Date(s); return isNaN(d)?"":iso(d);
}
function toBookings(rows){
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const ix=k=>h.indexOf(k);
  return rows.slice(1).map(r=>({
    id:r[ix("id")]||"", guest:(r[ix("guest")]||"").trim(), house:(r[ix("house")]||"").trim(),
    arrival:normaliseDate(r[ix("arrival")]), departure:normaliseDate(r[ix("departure")]),
    status:(r[ix("status")]||"").trim(), note:(r[ix("note")]||"").trim()
  }));
}
function clean(list){
  return list.filter(b=>b.guest&&b.house&&b.arrival&&b.departure&&b.departure>b.arrival
    &&b.status.toLowerCase()!=="cancelled"&&CONFIG.HOUSES.some(x=>x.key===b.house));
}

// ---------- data ----------
async function load(){
  const banner=$("banner");
  if(!CONFIG.CSV_URL){
    bookings=clean(SAMPLE);
    banner.innerHTML='<div class="banner"><b>Demo data.</b> Paste the published CSV link of your "Calendar Feed" tab into <code>CSV_URL</code> at the top of this file to go live.</div>';
    render(); stamp(); return;
  }
  try{
    const sep=CONFIG.CSV_URL.includes("?")?"&":"?";
    const res=await fetch(CONFIG.CSV_URL+sep+"t="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    bookings=clean(toBookings(parseCSV(await res.text())));
    banner.innerHTML=""; render(); stamp();
  }catch(e){
    banner.innerHTML='<div class="banner err"><b>Couldn\'t load the latest bookings.</b> Check your internet connection and tap Refresh.</div>';
    if(!bookings.length) render();
  }
}
function stamp(){const n=new Date();$("updated").textContent=`Updated ${n.getHours()}:${pad(n.getMinutes())} · from the booking sheet`}
function occupant(house,day){ // a guest occupies arrival … night before departure
  return bookings.find(b=>b.house===house&&b.arrival<=day&&day<b.departure);
}

// ---------- render ----------
function render(){
  const y=view.getFullYear(),m=view.getMonth();
  $("monthLabel").textContent=`${MONTHS[m]} ${y}`;
  const first=new Date(y,m,1), offset=(first.getDay()+6)%7; // Monday first
  const start=new Date(y,m,1-offset);
  const weeks=Math.ceil((offset+new Date(y,m+1,0).getDate())/7);
  let html="";
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);
    const cls=["day"]; if(d.getMonth()!==m)cls.push("out"); if(k===todayISO)cls.push("today"); if(k<todayISO)cls.push("past");
    let pills="";
    for(const h of CONFIG.HOUSES){
      const b=occupant(h.key,k);
      if(b){
        const prov=b.status.toLowerCase()==="provisional";
        pills+=`<span class="pill ${prov?"prov":"busy"}" title="${esc(h.key)}: ${esc(b.guest)}"><b>${h.short}</b><span class="who">${esc(b.guest)}</span></span>`;
      }else{
        pills+=`<span class="pill free" title="${esc(h.key)}: Available"><b>${h.short}</b><span class="who st">Available</span></span>`;
      }
    }
    html+=`<button class="${cls.join(" ")}" data-day="${k}" aria-label="${nice(k)}"><span class="num">${d.getDate()}</span>${pills}</button>`;
  }
  $("grid").innerHTML=html;
  renderList(y,m);
}
function renderList(y,m){
  const a=iso(new Date(y,m,1)), z=iso(new Date(y,m+1,1));
  const list=bookings.filter(b=>b.arrival<z&&b.departure>a).sort((p,q)=>p.arrival.localeCompare(q.arrival)||p.house.localeCompare(q.house));
  $("listTitle").textContent=`Bookings in ${MONTHS[m]} ${y}`;
  $("list").innerHTML=list.length?list.map(b=>`
    <button class="row" data-id="${esc(b.id)}">
      <span class="tag">${esc(short(b.house))}</span>
      <span class="main"><div>${esc(b.guest)}</div>
      <div class="sub">${nice(b.arrival)} → ${nice(b.departure)} · ${nights(b)} night${nights(b)===1?"":"s"}${b.status.toLowerCase()==="provisional"?" · Provisional":""}</div></span>
    </button>`).join(""):'<p class="empty">No bookings this month. Both guest houses are available.</p>';
}
const short=k=>(CONFIG.HOUSES.find(h=>h.key===k)||{short:k}).short;

// ---------- detail sheet ----------
function bookingCard(h,b,day){
  if(!b){
    const out=day&&bookings.find(x=>x.house===h.key&&x.departure===day);
    const nxt=bookings.filter(x=>x.house===h.key&&x.arrival>day).sort((p,q)=>p.arrival.localeCompare(q.arrival))[0];
    return `<div class="card"><div class="hd"><strong>${esc(h.key)}</strong><span class="status free">AVAILABLE</span></div>
      <dl>${out?`<dt>Check-out</dt><dd>${esc(out.guest)} leaves today</dd>`:""}
      <dt>Free until</dt><dd>${nxt?nice(nxt.arrival)+" (next arrival)":"No upcoming bookings"}</dd></dl></div>`;
  }
  const prov=b.status.toLowerCase()==="provisional";
  return `<div class="card"><div class="hd"><strong>${esc(h.key)}</strong><span class="status ${prov?"prov":"busy"}">${prov?"PROVISIONAL":"BOOKED"}</span></div>
    <dl><dt>Guest(s)</dt><dd>${esc(b.guest)}</dd>
    <dt>Arrival</dt><dd>${nice(b.arrival)}</dd>
    <dt>Departure</dt><dd>${nice(b.departure)}</dd>
    <dt>Stay</dt><dd>${nights(b)} night${nights(b)===1?"":"s"}</dd>
    ${b.id?`<dt>Ref</dt><dd>${esc(b.id)}</dd>`:""}</dl>
    ${b.note?`<div class="note">${esc(b.note)}</div>`:""}</div>`;
}
function openDay(day){
  const cards=CONFIG.HOUSES.map(h=>bookingCard(h,occupant(h.key,day),day)).join("");
  showSheet(`<button class="close" aria-label="Close">×</button><h3 id="sheetTitle">${nice(day)}</h3>
    <div class="date">Status of both guest houses on this night</div>${cards}`);
}
function openBooking(id){
  const b=bookings.find(x=>x.id===id); if(!b) return;
  const h=CONFIG.HOUSES.find(x=>x.key===b.house);
  showSheet(`<button class="close" aria-label="Close">×</button><h3 id="sheetTitle">${esc(b.guest)}</h3>
    <div class="date">${esc(b.house)}</div>${bookingCard(h,b)}`);
}
let lastFocus=null;
function showSheet(html){lastFocus=document.activeElement;$("sheet").innerHTML=html;$("scrim").classList.add("open");$("sheet").querySelector(".close").focus()}
function closeSheet(){$("scrim").classList.remove("open");if(lastFocus)lastFocus.focus()}

// ---------- share as picture ----------
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function stripes(ctx){
  const p=document.createElement("canvas");p.width=p.height=20;const c=p.getContext("2d");
  c.fillStyle="#E8806F";c.fillRect(0,0,20,20);c.strokeStyle="#C0392B";c.lineWidth=7;
  c.beginPath();c.moveTo(-5,25);c.lineTo(25,-5);c.moveTo(-5,5);c.lineTo(5,-5);c.moveTo(15,25);c.lineTo(25,15);c.stroke();
  return ctx.createPattern(p,"repeat");
}
function drawPicture(){
  const y=view.getFullYear(),m=view.getMonth();
  const first=new Date(y,m,1),offset=(first.getDay()+6)%7,start=new Date(y,m,1-offset);
  const weeks=Math.ceil((offset+new Date(y,m+1,0).getDate())/7);
  const W=1080,PAD=40,CW=(W-PAD*2)/7,CH=150,TOP=322,H=TOP+weeks*CH+190;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  const F='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  x.fillStyle="#F6F4EE";x.fillRect(0,0,W,H);
  x.fillStyle="#163A2B";x.fillRect(0,0,W,190);x.fillStyle="#C29B3B";x.fillRect(0,190,W,10);
  x.fillStyle="#FFFFFF";x.font=`800 54px ${F}`;x.fillText("Kibidula Guest Houses",PAD,88);
  x.fillStyle="#E6C877";x.font=`700 38px ${F}`;x.fillText(`Availability · ${MONTHS[m]} ${y}`,PAD,148);
  // legend
  const leg=[["#2E8B57","Available"],["#C0392B","Booked"],[null,"Provisional"]];let lx=PAD;
  x.font=`600 26px ${F}`;
  for(const[c,t]of leg){x.fillStyle=c||stripes(x);rr(x,lx,226,30,30,6);x.fill();x.fillStyle="#1D2420";x.fillText(t,lx+42,251);lx+=42+x.measureText(t).width+40}
  x.fillStyle="#6A716C";x.font=`600 24px ${F}`;x.textAlign="right";x.fillText("Top: Lake GH · Bottom: Ruaha GH",W-PAD,251);x.textAlign="left";
  // weekday header
  x.font=`700 22px ${F}`;x.fillStyle="#6A716C";
  ["MON","TUE","WED","THU","FRI","SAT","SUN"].forEach((d,i)=>{x.textAlign="center";x.fillText(d,PAD+CW*i+CW/2,TOP-12)});x.textAlign="left";
  const pat=stripes(x);
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);
    const cx=PAD+(i%7)*CW,cy=TOP+Math.floor(i/7)*CH;
    x.globalAlpha=d.getMonth()===m?1:0.35;
    x.fillStyle="#FFFDF8";rr(x,cx+4,cy+4,CW-8,CH-8,12);x.fill();
    x.strokeStyle=k===todayISO?"#C29B3B":"#E3DED2";x.lineWidth=k===todayISO?4:2;x.stroke();
    x.fillStyle="#1D2420";x.font=`800 28px ${F}`;x.fillText(String(d.getDate()),cx+16,cy+40);
    CONFIG.HOUSES.forEach((h,j)=>{
      const b=occupant(h.key,k),by=cy+56+j*44;
      x.fillStyle=b?(b.status.toLowerCase()==="provisional"?pat:"#C0392B"):"#2E8B57";
      rr(x,cx+12,by,CW-24,36,7);x.fill();
      x.fillStyle="#FFFFFF";x.font=`800 20px ${F}`;x.textAlign="center";x.fillText(h.short,cx+CW/2,by+25);x.textAlign="left";
    });
    x.globalAlpha=1;
  }
  const n=new Date(),fy=TOP+weeks*CH+46;
  x.fillStyle="#1D2420";x.font=`700 28px ${F}`;
  x.fillText(`Updated ${n.getDate()} ${MONTHS[n.getMonth()].slice(0,3)} ${n.getFullYear()}, ${n.getHours()}:${pad(n.getMinutes())}`,PAD,fy);
  x.fillStyle="#6A716C";x.font=`600 24px ${F}`;x.fillText("Tap the live calendar for guest names and the latest changes:",PAD,fy+44);
  x.fillStyle="#163A2B";x.font=`700 26px ${F}`;x.fillText(pageURL().replace(/^https?:\/\//,""),PAD,fy+86);
  x.fillStyle="#C29B3B";x.fillRect(0,H-12,W,12);
  return cv;
}
const pageURL=()=>location.href.split(/[?#]/)[0];
async function sharePicture(){
  const btn=$("shareBtn");btn.disabled=true;
  try{
    const cv=drawPicture();
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    const name=`Guest-houses-${MONTHS[view.getMonth()]}-${view.getFullYear()}.png`;
    const file=new File([blob],name,{type:"image/png"});
    const text=`Guest house availability – ${MONTHS[view.getMonth()]} ${view.getFullYear()}. Green = available, red = booked. Live calendar: ${pageURL()}`;
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],text});}catch(e){}
    }else{
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    }
  }finally{btn.disabled=false}
}
$("shareBtn").onclick=sharePicture;

// ---------- events ----------
$("grid").addEventListener("click",e=>{const d=e.target.closest(".day");if(d)openDay(d.dataset.day)});
$("list").addEventListener("click",e=>{const r=e.target.closest(".row");if(r)openBooking(r.dataset.id)});
$("scrim").addEventListener("click",e=>{if(e.target.id==="scrim"||e.target.closest(".close"))closeSheet()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeSheet();
  if($("scrim").classList.contains("open"))return;
  if(e.key==="ArrowLeft"&&!e.target.closest("input"))step(-1);
  if(e.key==="ArrowRight"&&!e.target.closest("input"))step(1);
});
function step(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}
$("prev").onclick=()=>step(-1); $("next").onclick=()=>step(1);
$("todayBtn").onclick=()=>{view=new Date();view.setDate(1);render()};
$("refresh").onclick=load;
// swipe between months on phones
let sx=null;$("grid").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("grid").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60)step(dx<0?1:-1);sx=null});
if(CONFIG.CONTACT)$("contact").textContent="Bookings: "+CONFIG.CONTACT;
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&CONFIG.CSV_URL)load()});
setInterval(()=>{if(!document.hidden&&CONFIG.CSV_URL)load()},5*60*1000);
load();
</script>
